<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELECTOR DE RECURSOS</title>

    <!-- Fonts: Bangers (Comic), Anton (Impact), Roboto (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Roboto:wght@400;700;900&display=swap"
        rel="stylesheet">

    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="home_styles.css">
</head>

<body>
    <!-- Background Pattern -->
    <div class="bg-p5-pattern"></div>

    <div id="app" v-cloak>

        <!-- Animated Background Halftone -->
        <div class="p5-halftone"></div>

        <!-- Header -->
        <header class="p5-header">
            <div class="p5-title-box hardcore-glass">
                <h1 class="p5-title">TALLER DE <span style="color: var(--p5-red)">BASES DE DATOS</span></h1>
                <div class="p5-subtitle">PL/SQL MASTERY</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="p5-content">

            <!-- Floating Stars -->
            <div class="shape shape-star" style="top: 20%; left: 10%; width: 50px; height: 50px;"></div>
            <div class="shape shape-star"
                style="top: 70%; left: 5%; width: 30px; height: 30px; animation-duration: 4s;"></div>
            <div class="shape shape-star" style="top: 15%; right: 15%; width: 40px; height: 40px; animation-delay: 1s;">
            </div>

            <!-- HERO SECTION (Top 60%) -->
            <div class="p5-hero" :style="{ borderColor: hoveredItem.color }">
                <!-- Dynamic Background Image of Hero -->
                <div class="hero-bg" :style="{ backgroundImage: hoveredItem.image }">
                    <!-- Fallback if no image -->
                    <div v-if="!hoveredItem.image" class="w-full h-full flex items-center justify-center opacity-10">
                        <ion-icon name="game-controller" style="font-size: 15rem; color: white;"></ion-icon>
                    </div>
                </div>

                <!-- Hero Content -->
                <div class="hero-content">
                    <div class="hero-header">
                        <div class="hero-number">{{ menuItems.indexOf(hoveredItem) + 1 }}</div>
                        <h1 class="hero-title" :style="{ textShadow: '4px 4px 0 ' + hoveredItem.color }">
                            {{ hoveredItem.title }}
                        </h1>
                    </div>
                    <div class="hero-meta">
                        <span class="hero-badge" :style="{ background: hoveredItem.color }">{{ hoveredItem.subtitle
                            }}</span>
                        <!-- Decorative Line -->
                        <div class="hero-line" :style="{ background: hoveredItem.color }"></div>
                    </div>
                    <p class="hero-description">
                        {{ hoveredItem.previewText }}
                    </p>

                    <button class="hero-btn" @click="navigateTo(hoveredItem)"
                        :style="{ borderColor: hoveredItem.color, color: hoveredItem.color }">
                        INICIAR TALLER <ion-icon name="arrow-forward"></ion-icon>
                    </button>
                </div>

                <!-- Decorative Elements -->
                <div class="p5-divider-horizontal"></div>
            </div>

            <!-- CAROUSEL SECTION (Bottom 40%) -->
            <div class="p5-carousel-container">
                <div class="p5-carousel">
                    <!-- Cards -->
                    <div v-for="(item, index) in menuItems" :key="item.id" class="carousel-card"
                        :class="{ 'active': hoveredItem.id === item.id }" @mouseover="setHovered(item)"
                        @click="navigateTo(item)" :style="{ '--card-color': item.color }">

                        <div class="card-inner">
                            <span class="card-number">{{ index + 1 }}</span>
                            <div class="card-icon">
                                <!-- Icons mappings based on ID or custom -->
                                <ion-icon v-if="index === 0" name="school"></ion-icon>
                                <ion-icon v-else-if="index === 1" name="book"></ion-icon>
                                <ion-icon v-else-if="index === 2" name="construct"></ion-icon>
                                <ion-icon v-else-if="index === 3" name="alert-circle"></ion-icon>
                                <ion-icon v-else-if="index === 4" name="trophy"></ion-icon>
                                <ion-icon v-else-if="index === 5" name="skull"></ion-icon>
                                <ion-icon v-else-if="index === 6" name="fitness"></ion-icon>
                                <ion-icon v-else-if="index === 7" name="layers"></ion-icon>
                                <ion-icon v-else-if="index === 8" name="cube"></ion-icon>
                                <ion-icon v-else-if="index === 9" name="return-up-back"></ion-icon>
                                <ion-icon v-else-if="index === 10" name="cube-outline"></ion-icon>
                                <ion-icon v-else-if="index === 11" name="hammer"></ion-icon>
                                <ion-icon v-else-if="index === 12" name="leaf"></ion-icon>
                                <ion-icon v-else name="cube"></ion-icon>
                            </div>
                            <h3 class="card-title">{{ item.title }}</h3>
                        </div>
                    </div>
                    <!-- Spacer for scrolling -->
                    <div style="min-width: 50px;"></div>
                </div>
            </div>

        </main>

        <!-- Transition Overlay -->
        <div class="transition-overlay" :class="{ 'active': isTransitioning }">
            <div class="take-your-heart">ACCEDIENDO...</div>
        </div>

    </div>

    <script src="home_app.js"></script>
</body>

</html>
